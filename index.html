 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buggy Game</title>
<style>
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:#fbfaf8;
    color:#1c1a17;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size:16px;
    line-height:1.55;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 20px 90px;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%;
    max-width:600px;
  }

  .mono{
    font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }

  /* -------- header -------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:2px solid #1c1a17;
    padding-bottom:14px;
    margin-bottom:36px;
  }
  .topbar .title{
    font-size:15px;
    font-weight:600;
    letter-spacing:-0.01em;
    color:#1c1a17;
  }
  .topbar .title .dot{
    display:inline-block;
    width:7px;height:7px;
    background:#8a5a34;
    border-radius:50%;
    margin-right:8px;
    vertical-align:1px;
  }
  .topbar .progress{
    font-size:13px;
    color:#8a8478;
    font-variant-numeric:tabular-nums;
  }

  /* -------- screens -------- */
  .screen{display:none;}
  .screen.active{display:block;}

  .eyebrow{
    color:#8a8478;
    font-size:13px;
    margin-bottom:10px;
  }

  input[type=text]{
    width:100%;
    background:#ffffff;
    border:2px solid #e5e0d8;
    color:#1c1a17;
    font-family:inherit;
    font-size:16px;
    padding:13px 14px;
    border-radius:8px;
    outline:none;
    transition:border-color .15s ease;
  }
  input[type=text]:focus{border-color:#1c1a17;}

  button{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    background:#1c1a17;
    color:#fbfaf8;
    border:2px solid #1c1a17;
    padding:12px 22px;
    border-radius:8px;
    cursor:pointer;
    letter-spacing:0.01em;
    transition:opacity .15s ease, transform .1s ease;
  }
  button:hover{opacity:0.82;}
  button:active{transform:scale(0.98);}
  button:disabled{opacity:0.28;cursor:default;}
  button:disabled:hover{opacity:0.28;}

  button.ghost{
    background:transparent;
    color:#1c1a17;
    border:2px solid #e5e0d8;
  }
  button.ghost:hover{background:#f2ede4;opacity:1;}

  .row{margin-top:22px;}

  /* -------- question screen -------- */
  .q-meta{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .q-meta .tag{
    font-size:12px;
    font-weight:700;
    color:#ffffff;
    background:#8a5a34;
    padding:3px 9px;
    border-radius:20px;
    letter-spacing:0.02em;
  }
  .q-meta .section{
    font-size:13px;
    color:#8a8478;
  }
  .q-text{
    font-size:18px;
    font-weight:600;
    color:#1c1a17;
    margin-bottom:18px;
    letter-spacing:-0.01em;
  }
  .q-code{
    display:block;
    background:#f2ede4;
    border:1px solid #e5e0d8;
    border-radius:8px;
    padding:14px 16px;
    margin:0 0 22px;
    color:#4a4238;
    font-size:14px;
    overflow-x:auto;
    white-space:pre;
  }

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    text-align:left;
    background:#ffffff;
    border:2px solid #e5e0d8;
    color:#1c1a17;
    padding:14px 16px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    font-size:14.5px;
    line-height:1.5;
    display:flex;
    gap:12px;
    transition:border-color .12s ease, background .12s ease;
  }
  .opt .k{
    color:#8a8478;
    flex:0 0 auto;
    font-weight:700;
    font-size:13px;
  }
  .opt:hover{border-color:#c9c1b2;}
  .opt.correct{border-color:#3f7a4e;background:#eef6ef;color:#2d5b38;}
  .opt.correct .k{color:#3f7a4e;}
  .opt.wrong{border-color:#b8474f;background:#fbeeee;color:#8c333a;}
  .opt.wrong .k{color:#b8474f;}
  .opt.disabled{cursor:default;}
  .opt.disabled:hover{border-color:#e5e0d8;}
  .opt.correct.disabled:hover{border-color:#3f7a4e;}
  .opt.wrong.disabled:hover{border-color:#b8474f;}
  .opt.faded{opacity:0.45;}

  .feedback{
    margin-top:18px;
    font-size:14px;
    color:#8a8478;
    min-height:20px;
    font-weight:600;
  }
  .feedback.show-correct{color:#3f7a4e;}
  .feedback.show-wrong{color:#b8474f;}

  .nextrow{margin-top:24px;display:flex;justify-content:flex-end;}

  /* -------- results -------- */
  .score-big{
    font-size:52px;
    font-weight:700;
    color:#1c1a17;
    letter-spacing:-0.02em;
    margin:6px 0 4px;
  }
  .score-sub{color:#8a8478;font-size:14px;margin-bottom:24px;}
  .label{
    display:inline-block;
    padding:10px 16px;
    background:#f2ede4;
    border-radius:10px;
    color:#1c1a17;
    font-weight:600;
    font-size:14.5px;
    margin-bottom:32px;
  }
  .review-item{
    border-top:1px solid #e5e0d8;
    padding:16px 0;
    font-size:14px;
  }
  .review-item .rq{color:#1c1a17;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
  .review-item .ra{color:#8a8478;padding-left:24px;}
  .review-item .mark{
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;border-radius:50%;
    font-size:11px;font-weight:700;flex:0 0 auto;
  }
  .review-item.hit .mark{background:#eef6ef;color:#3f7a4e;}
  .review-item.miss .mark{background:#fbeeee;color:#b8474f;}

  footer{
    text-align:center;color:#8a8478;font-size:12px;margin-top:48px;
    border-top:1px solid #e5e0d8;padding-top:16px;
  }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="title"><span class="dot"></span> Java Buggy Game</div>
    <div class="progress mono" id="progressLabel"></div>
  </div>

  <!-- SCREEN 0: name -->
  <div class="screen active" id="screen-start">
    <div class="eyebrow">Enter your name to begin</div>
    <input type="text" id="nameInput" placeholder="Player name" autocomplete="off" maxlength="30">
    <div class="row">
      <button id="startBtn">Start quiz</button>
    </div>
  </div>

  <!-- SCREEN 1: question -->
  <div class="screen" id="screen-quiz">
    <div class="q-meta">
      <span class="tag mono" id="qTag"></span>
      <span class="section" id="qSection"></span>
    </div>
    <div class="q-text" id="qText"></div>
    <div class="q-code mono" id="qCode" style="display:none;"></div>
    <div class="options" id="qOptions"></div>
    <div class="feedback" id="qFeedback"></div>
    <div class="nextrow">
      <button id="nextBtn" disabled>Next</button>
    </div>
  </div>

  <!-- SCREEN 2: results -->
  <div class="screen" id="screen-results">
    <div class="eyebrow">Quiz complete</div>
    <div class="score-big" id="scoreBig"></div>
    <div class="score-sub" id="scoreSub"></div>
    <div class="label" id="perfLabel"></div>
    <div id="reviewList"></div>
    <div class="row">
      <button class="ghost" id="restartBtn">Run again</button>
    </div>
  </div>

  <footer>Summative 1</footer>
</div>

<script>
// ---------------------------------------------------------
// QUESTION BANK
// Each option array is kept to a similar length/shape on
// purpose, so length is never a giveaway for the answer.
// ---------------------------------------------------------
const QUESTIONS = [
{
  section:"Variables & Types", tag:"01",
  text:"What is the real difference between a variable and a constant in Java?",
  code:null,
  options:[
    "A variable can change during execution; a constant, once assigned, cannot.",
    "A constant can change during execution; a variable, once assigned, cannot.",
    "A variable only exists inside loops; a constant only exists inside methods.",
    "There is no real difference — both terms describe the same thing."
  ],
  correct:0
},
{
  section:"Variables & Types", tag:"02",
  text:"MAX_QUESTIONS must hold a whole number and never change. Which line is correct?",
  code:"static final ____ MAX_QUESTIONS = 5;",
  options:[
    "static final int MAX_QUESTIONS = 5;",
    "static final double MAX_QUESTIONS = 5;",
    "static final boolean MAX_QUESTIONS = 5;",
    "static final String MAX_QUESTIONS = 5;"
  ],
  correct:0
},
{
  section:"Variables & Types", tag:"03",
  text:"Which line correctly declares a variable named playerName that stores text?",
  code:null,
  options:[
    "String playerName;",
    "int playerName;",
    "boolean playerName;",
    "text playerName;"
  ],
  correct:0
},
{
  section:"Variables & Types", tag:"04 ⚠",
  text:"This line has a bug. What's the corrected version?",
  code:"static double isGameOver = false;",
  options:[
    "static boolean isGameOver = false;",
    "static double isGameOver = 0.0;",
    "static float isGameOver = false;",
    "static double isGameOver = \"false\";"
  ],
  correct:0
},
{
  section:"Arrays & Collections", tag:"05",
  text:"Which declaration correctly creates an ArrayList that stores String elements?",
  code:null,
  options:[
    "ArrayList<String> answers = new ArrayList<>();",
    "ArrayList answers = new String();",
    "String<ArrayList> answers = new ArrayList<>();",
    "ArrayList<string> answers = new ArrayList<>();"
  ],
  correct:0
},
{
  section:"Arrays & Collections", tag:"06",
  text:"Which line declares an int array named scorePerQuestion, sized to MAX_QUESTIONS?",
  code:null,
  options:[
    "int[] scorePerQuestion = new int[MAX_QUESTIONS];",
    "int scorePerQuestion[] = MAX_QUESTIONS;",
    "int[] scorePerQuestion = new int(MAX_QUESTIONS);",
    "array scorePerQuestion = new int[MAX_QUESTIONS];"
  ],
  correct:0
},
{
  section:"Functions & Returns", tag:"07",
  text:"What does 'void' mean as a method's return type?",
  code:null,
  options:[
    "The method performs an action but returns no value to the caller.",
    "The method must return an integer value to the caller.",
    "The method is only allowed to run one single time.",
    "The method can only ever be called from inside main()."
  ],
  correct:0
},
{
  section:"Functions & Returns", tag:"08 ⚠",
  text:"This return statement has a bug. What's the corrected version?",
  code:"return playerAnswer == answers.get(questionIndex);",
  options:[
    "return playerAnswer.equalsIgnoreCase(answers.get(questionIndex));",
    "return playerAnswer.equals(questionIndex);",
    "return playerAnswer = answers.get(questionIndex);",
    "return playerAnswer != answers.get(questionIndex);"
  ],
  correct:0
},
{
  section:"Functions & Returns", tag:"09",
  text:"Which for-loop correctly adds up every value in scorePerQuestion into 'total'?",
  code:null,
  options:[
    "for (int i = 0; i < scorePerQuestion.length; i++) { total += scorePerQuestion[i]; }",
    "for (int i = 0; i <= scorePerQuestion.length; i++) { total = scorePerQuestion[i]; }",
    "for (int i = 1; i < scorePerQuestion.length; i--) { total += scorePerQuestion[i]; }",
    "for (int i : total) { scorePerQuestion += i; }"
  ],
  correct:0
},
{
  section:"Control Flow", tag:"10",
  text:"getPerformanceLabel(score) uses a switch statement. Which variable should it switch on?",
  code:"switch ( ____ ) { case 5: ... }",
  options:[
    "score",
    "questionNumber",
    "MAX_QUESTIONS",
    "playerAnswer"
  ],
  correct:0
},
{
  section:"Control Flow", tag:"11",
  text:"Which case block correctly handles scores of 1 and 2, both returning the same message?",
  code:null,
  options:[
    "case 2:\ncase 1:\n    return \"Keep going! Practice more.\";",
    "case 1 and case 2:\n    return \"Keep going! Practice more.\";",
    "case 1-2:\n    return \"Keep going! Practice more.\";",
    "if (case == 1 || case == 2)\n    return \"Keep going! Practice more.\";"
  ],
  correct:0
},
{
  section:"Control Flow", tag:"12",
  text:"What is the scope of the variable 'i' declared inside a for-loop's header?",
  code:"for (int i = 0; i < MAX_QUESTIONS; i++) { ... }",
  options:[
    "It only exists inside the loop, from the header to the closing brace.",
    "It exists for the rest of the program once it has been declared.",
    "It only exists during the very first pass through the loop body.",
    "It automatically exists in every method defined in the class."
  ],
  correct:0
},
{
  section:"Control Flow", tag:"13",
  text:"Which line correctly prints the question number, text, and right/wrong status?",
  code:null,
  options:[
    "System.out.println(\"Q\"+(i+1)+\": \"+questions[i]+\" -> \"+(scorePerQuestion[i]==1?\"Correct\":\"Wrong\"));",
    "System.out.println(\"Q\" + i + \": \" + questions[i] + scorePerQuestion);",
    "System.out.println(questions[i] + scorePerQuestion[i] == 1);",
    "print(\"Q\" + i + questions[i] + scorePerQuestion[i]);"
  ],
  correct:0
},
{
  section:"Input & Loops", tag:"14",
  text:"Which line correctly reads the player's typed input into the playerName variable?",
  code:null,
  options:[
    "playerName = scanner.nextLine();",
    "playerName = scanner.next();",
    "scanner.playerName();",
    "playerName == scanner.nextLine();"
  ],
  correct:0
},
{
  section:"Input & Loops", tag:"15",
  text:"Which while-loop condition keeps the game going while under MAX_QUESTIONS AND continueGame is true?",
  code:"while ( ____ ) { ... }",
  options:[
    "questionNumber < MAX_QUESTIONS && continueGame",
    "questionNumber <= MAX_QUESTIONS || continueGame",
    "questionNumber > MAX_QUESTIONS && continueGame",
    "continueGame = true"
  ],
  correct:0
},
{
  section:"Input & Loops", tag:"16",
  text:"Which if-else block correctly checks the answer and records the result?",
  code:null,
  options:[
    "if (checkAnswer(playerAnswer, questionNumber)) {\n  scorePerQuestion[questionNumber] = 1;\n} else {\n  scorePerQuestion[questionNumber] = 0;\n}",
    "if (checkAnswer(playerAnswer, questionNumber) = true) {\n  scorePerQuestion[questionNumber] = 1;\n}",
    "if playerAnswer == checkAnswer(questionNumber) {\n  scorePerQuestion[questionNumber] = 1;\n}",
    "while (checkAnswer(playerAnswer, questionNumber)) {\n  scorePerQuestion[questionNumber] = 1;\n}"
  ],
  correct:0
},
{
  section:"Input & Loops", tag:"17 ⚠",
  text:"This block has two separate bugs. Which version fixes both of them?",
  code:"if (questionNumber = 2) {\n  ...\n  if (choice.equalsIgnoreCase(\"no\")) {\n    continueGame == false;\n  }\n}",
  options:[
    "if (questionNumber == 2) { ... if (choice.equalsIgnoreCase(\"no\")) { continueGame = false; } }",
    "if (questionNumber = 2) { ... if (choice.equalsIgnoreCase(\"no\")) { continueGame == false; } }",
    "if (questionNumber == 2) { ... if (choice.equalsIgnoreCase(\"no\")) { continueGame == false; } }",
    "if (questionNumber != 2) { ... if (choice.equalsIgnoreCase(\"no\")) { continueGame = true; } }"
  ],
  correct:0
},
{
  section:"Input & Loops", tag:"18",
  text:"Which do-while loop correctly keeps asking until the player types 'yes' or 'no'?",
  code:null,
  options:[
    "do {\n  replayChoice = scanner.nextLine().trim();\n} while (!replayChoice.equalsIgnoreCase(\"yes\") && !replayChoice.equalsIgnoreCase(\"no\"));",
    "while (replayChoice != \"yes\") {\n  replayChoice = scanner.nextLine();\n}",
    "do {\n  replayChoice = scanner.nextLine();\n} while (replayChoice.equals(\"yes\"));",
    "for (replayChoice; !replayChoice.equals(\"yes\"); ) { }"
  ],
  correct:0
},
{
  section:"Wrap-up", tag:"19",
  text:"Why is calling scanner.close() at the end of the program good practice?",
  code:null,
  options:[
    "It releases the system resource held by the Scanner, avoiding a resource leak.",
    "It permanently deletes whatever the user had typed into the program.",
    "It automatically restarts the Java Virtual Machine for the next run.",
    "It is required by Java or the program will fail to compile at all."
  ],
  correct:0
},
{
  section:"Wrap-up", tag:"20",
  text:"An ArrayList and an array can both store multiple values. What's a key practical difference?",
  code:null,
  options:[
    "An ArrayList can grow or shrink in size; a plain array has a fixed size once created.",
    "An array can grow or shrink in size; an ArrayList has a fixed size once created.",
    "An ArrayList can only ever store integers, never text or objects.",
    "A plain array can only ever store a single value, never a list."
  ],
  correct:0
}
];

// ---------------------------------------------------------
// STATE + helpers
// ---------------------------------------------------------
let order = [];        // shuffled question indices
let current = 0;
let score = 0;
let answered = false;
let reviewLog = [];    // {qIndex, chosen, correct}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// shuffle the option order per-question too, so "A" isn't always right
function buildShuffledOptions(q){
  const idxs = shuffle([0,1,2,3]);
  const opts = idxs.map(i => q.options[i]);
  const correctPos = idxs.indexOf(q.correct);
  return {opts, correctPos};
}

const screens = {
  start: document.getElementById('screen-start'),
  quiz: document.getElementById('screen-quiz'),
  results: document.getElementById('screen-results')
};
function showScreen(name){
  Object.values(screens).forEach(s=>s.classList.remove('active'));
  screens[name].classList.add('active');
}

const progressLabel = document.getElementById('progressLabel');

// ---------------------------------------------------------
// START
// ---------------------------------------------------------
let playerName = "";
document.getElementById('startBtn').addEventListener('click', begin);
document.getElementById('nameInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') begin();
});
function begin(){
  const val = document.getElementById('nameInput').value.trim();
  playerName = val.length ? val : "player";
  order = shuffle(QUESTIONS.map((_,i)=>i));
  current = 0; score = 0; reviewLog = [];
  showScreen('quiz');
  renderQuestion();
}

// ---------------------------------------------------------
// QUIZ
// ---------------------------------------------------------
const qTag = document.getElementById('qTag');
const qSection = document.getElementById('qSection');
const qText = document.getElementById('qText');
const qCode = document.getElementById('qCode');
const qOptions = document.getElementById('qOptions');
const qFeedback = document.getElementById('qFeedback');
const nextBtn = document.getElementById('nextBtn');

let activeShuffled = null;

function renderQuestion(){
  answered = false;
  qFeedback.textContent = "";
  qFeedback.className = "feedback";
  nextBtn.disabled = true;
  nextBtn.textContent = (current === order.length-1) ? "see results →" : "next →";

  const q = QUESTIONS[order[current]];
  progressLabel.textContent = `${current+1} / ${order.length}`;
  qTag.textContent = "#" + q.tag;
  qSection.textContent = q.section;
  qText.textContent = q.text;

  if(q.code){
    qCode.style.display = "block";
    qCode.textContent = q.code;
  } else {
    qCode.style.display = "none";
  }

  activeShuffled = buildShuffledOptions(q);
  qOptions.innerHTML = "";
  const letters = ["A","B","C","D"];
  activeShuffled.opts.forEach((optText, i)=>{
    const btn = document.createElement('button');
    btn.className = "opt";
    btn.innerHTML = `<span class="k">${letters[i]}</span><span>${escapeHtml(optText)}</span>`;
    btn.addEventListener('click', ()=> selectOption(i, btn));
    qOptions.appendChild(btn);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function selectOption(i, btnEl){
  if(answered) return;
  answered = true;
  const q = QUESTIONS[order[current]];
  const isCorrect = i === activeShuffled.correctPos;

  [...qOptions.children].forEach((el, idx)=>{
    el.classList.add('disabled');
    if(idx === activeShuffled.correctPos) el.classList.add('correct');
    if(idx === i && !isCorrect) el.classList.add('wrong');
    if(idx !== i && idx !== activeShuffled.correctPos) el.classList.add('faded');
  });

  if(isCorrect){
    score++;
    qFeedback.textContent = "correct.";
    qFeedback.classList.add('show-correct');
  } else {
    qFeedback.textContent = "not quite — correct answer highlighted above.";
    qFeedback.classList.add('show-wrong');
  }

  reviewLog.push({
    section:q.section, tag:q.tag, text:q.text,
    correctText: q.options[q.correct],
    wasCorrect:isCorrect
  });

  nextBtn.disabled = false;
}

nextBtn.addEventListener('click', ()=>{
  if(current < order.length - 1){
    current++;
    renderQuestion();
  } else {
    renderResults();
  }
});

// ---------------------------------------------------------
// RESULTS
// ---------------------------------------------------------
function performanceLabel(s, total){
  const pct = s/total;
  if(pct === 1) return "🏆 Perfect score — you're a Java master!";
  if(pct >= 0.8) return "🥈 Great job! Almost perfect!";
  if(pct >= 0.6) return "🥉 Good effort — keep practicing.";
  if(pct >= 0.3) return "💪 Keep going — practice more.";
  return "😢 Don't give up — review your notes.";
}

function renderResults(){
  showScreen('results');
  progressLabel.textContent = "done";
  document.getElementById('scoreBig').textContent = `${score} / ${order.length}`;
  document.getElementById('scoreSub').textContent = `${playerName} — final score`;
  document.getElementById('perfLabel').textContent = performanceLabel(score, order.length);

  const list = document.getElementById('reviewList');
  list.innerHTML = "";
  reviewLog.forEach(item=>{
    const div = document.createElement('div');
    div.className = "review-item " + (item.wasCorrect ? "hit" : "miss");
    div.innerHTML = `
      <div class="rq"><span class="mark">${item.wasCorrect ? "✓" : "✗"}</span>#${item.tag} · ${escapeHtml(item.section)}</div>
      <div class="ra">${item.wasCorrect ? "you got this one" : "correct answer: " + escapeHtml(item.correctText)}</div>
    `;
    list.appendChild(div);
  });
}

document.getElementById('restartBtn').addEventListener('click', ()=>{
  document.getElementById('nameInput').value = "";
  showScreen('start');
  progressLabel.textContent = "";
});
</script>
</body>
</html>
